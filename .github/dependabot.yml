# Dependency updates, proposed rather than applied.
#
# Once a week, one pull request per ecosystem carries every minor and patch
# update, so the lock files change once and nothing has to be rebased against
# a sibling. Major updates still come one by one, because each can break
# something and deserves its own review. Security updates do not wait for the
# schedule: Dependabot raises them as soon as an advisory is published, grouped
# per ecosystem and kept apart from the weekly version updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      composer:
        applies-to: version-updates
        update-types: [minor, patch]
      composer-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      npm:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # ESLint 10 waits for eslint-plugin-react to support it (npm ERESOLVE otherwise).
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Node types follow the Node version in .nvmrc (24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is planned after 1.0 (see docs/architecture/02-platform-architecture-proposal.md).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
