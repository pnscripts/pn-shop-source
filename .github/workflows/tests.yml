name: tests

on:
  push:
    branches:
      - main
      - next
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    name: tests (PHP ${{ matrix.php }})

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Bundle Size Budget
        run: node scripts/check-bundle-size.mjs

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Tests
        run: ./vendor/bin/phpunit

  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
          - db: pgsql
            port: 5432

    name: tests (${{ matrix.db }})

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pnshop
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: pnshop
          POSTGRES_USER: pnshop
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: pnshop
      DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'pnshop' }}
      DB_PASSWORD: password

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm run build
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Tests
        run: ./vendor/bin/phpunit

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    name: release trees and create-project

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          composer install --no-interaction --prefer-dist

      - name: Build the core package and the skeleton
        run: scripts/release/build-dist.sh "$RUNNER_TEMP/dist"

      # Local tagged repositories stand in for GitHub and Packagist.
      - name: composer create-project from the release trees
        run: |
          version=$(sed -n "s/.*VERSION = '\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p" packages/pn-shop-core/src/Foundation/PnShop.php)
          for package in pn-shop-core pn-shop; do
            git -C "$RUNNER_TEMP/dist/$package" init -q -b main
            git -C "$RUNNER_TEMP/dist/$package" add -A
            git -C "$RUNNER_TEMP/dist/$package" -c user.name=ci -c user.email=ci@example.test commit -qm "$version"
            git -C "$RUNNER_TEMP/dist/$package" tag "v$version"
          done
          export COMPOSER_HOME="$RUNNER_TEMP/composer-home"
          mkdir -p "$COMPOSER_HOME"
          echo "{\"repositories\": [{\"type\": \"vcs\", \"url\": \"$RUNNER_TEMP/dist/pn-shop-core\"}, {\"type\": \"vcs\", \"url\": \"$RUNNER_TEMP/dist/pn-shop\"}]}" > "$COMPOSER_HOME/config.json"
          composer create-project pnscripts/pn-shop "$RUNNER_TEMP/shop" "$version" --no-interaction --prefer-dist

      - name: Install the shop without Node
        working-directory: ${{ runner.temp }}/shop
        run: |
          test -f public/vendor/pnshop/build/manifest.json
          test ! -d packages
          php artisan pnshop:install --no-interaction --app-url=http://localhost --store-name=CI --store-email=ci@example.test \
            --admin-name=CI --admin-email=ci@example.test --generate-password > /dev/null
          php artisan about --only=pn_shop
          php artisan pnshop:update --dry-run
