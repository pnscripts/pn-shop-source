name: lint

on:
  push:
    branches:
      - main
      - next
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan (app, level 5)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Larastan (core, level 7)
        run: vendor/bin/phpstan analyse -c phpstan-core.neon --no-progress --memory-limit=1G

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      - name: TypeScript
        run: npm run types

      - name: Composer audit
        run: composer audit

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
